# Enables real per-user network byte accounting via systemd/cgroup v2, used
# by the "SSH account usage" figures in the dashboard. Without this file,
# the panel has no real source for per-account bandwidth and will correctly
# show "no data" rather than inventing numbers.
#
# Install as a drop-in on the user-@.slice TEMPLATE (applies to every user
# slice, i.e. every logged-in Linux user, including panel-managed SSH
# accounts):
#
#   sudo mkdir -p /etc/systemd/system/user-.slice.d
#   sudo cp user-slice-ipaccounting.conf /etc/systemd/system/user-.slice.d/override.conf
#   sudo systemctl daemon-reload
#
# Existing logged-in sessions must log out/in once (or the host rebooted)
# for the new slice to pick up accounting - this is a systemd/cgroup
# limitation, not something the panel can work around.
[Slice]
IPAccounting=yes
