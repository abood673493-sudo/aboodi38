# nginx config for the SSH Manager Panel web UI + API.
#
# This fronts the React admin panel and proxies /api to the Go backend
# (listening on 127.0.0.1:8080, unprivileged). The WebSocket/TLS SSH bridge
# is intentionally NOT proxied here - it terminates its own TLS directly on
# its own port (see BRIDGE_LISTEN_ADDR / BRIDGE_TLS_CERT / BRIDGE_TLS_KEY in
# .env.example) using the same certificate, so HTTP Injector-style clients
# can be pointed at a single dedicated port independent of the web UI.
#
# nginx itself starts as root and reads /etc/letsencrypt/live/<domain>
# directly during config load, same as any standard certbot+nginx setup -
# it does NOT need the restricted /etc/sshpanel/certs copy that the
# always-unprivileged Go bridge process uses instead.
#
# Replace ssh.example.com everywhere below, then:
#   sudo cp sshpanel.conf /etc/nginx/sites-available/sshpanel.conf
#   sudo ln -s /etc/nginx/sites-available/sshpanel.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx

# Plain HTTP: only ever used for the ACME HTTP-01 challenge and a redirect.
# Nothing else is served over port 80.
server {
    listen 80;
    listen [::]:80;
    server_name ssh.example.com;

    location /.well-known/acme-challenge/ {
        root /var/www/sshpanel-acme;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name ssh.example.com;

    ssl_certificate     /etc/letsencrypt/live/ssh.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ssh.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:sshpanel_ssl:10m;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    # React single-page app build (see frontend/README for the build step).
    root /opt/sshpanel/web;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Backend API - proxied, never exposed directly to the internet.
    location /api/ {
        proxy_pass http://127.0.0.1:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # The login endpoint is independently rate-limited inside the Go
        # service itself (see internal/middleware.IPRateLimiter); nginx does
        # not need its own limit_req here for that reason, but add one at
        # this layer too if the panel is directly internet-facing.
    }
}
