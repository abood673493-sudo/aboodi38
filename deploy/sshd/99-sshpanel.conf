# sshd hardening for panel-managed tunnel accounts.
#
# The panel already creates these accounts with `--shell /usr/sbin/nologin`
# (see backend/cmd/sshpanel-helper), which blocks interactive shell access
# on its own - port forwarding does not need a shell, only authentication.
# This drop-in is defense in depth on top of that: it makes the restriction
# explicit at the sshd level too, so it holds even if an account's shell is
# ever changed by hand, and it turns off things a tunnel-only account never
# needs (PTYs, X11, further forwarding chains).
#
# Install:
#   sudo cp 99-sshpanel.conf /etc/ssh/sshd_config.d/99-sshpanel.conf
#   sudo sshd -t              # validate before reloading
#   sudo systemctl reload ssh
#
# Requires OpenSSH >= 7.4 (Ubuntu 20.04+) for sshd_config.d/Match support.

Match Group sshpanel
    # This is the whole feature: let the TCP forwarding / SOCKS tunnel
    # through, deny everything that looks like a login.
    AllowTcpForwarding yes
    PermitTTY no
    X11Forwarding no
    AllowAgentForwarding no
    PermitTunnel no
    ForceCommand /usr/sbin/nologin
    # Keep idle tunnels from accumulating forever if a client disappears
    # without closing the connection cleanly.
    ClientAliveInterval 60
    ClientAliveCountMax 3
Match All
